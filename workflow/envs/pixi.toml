[workspace]
name = "atac-smk-envs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.13"
bedtools = ">=2.31.1"
bigtools = ">=0.5.8"
bowtie2 = ">=2.5.5"
cutadapt = ">=5.2"
deeptools = ">=4.0"
fastp = ">=1.4.0"
macs3 = ">=3.0.5"
openssl = ">=3.6"
picard = ">=3.5.0"
sambamba = ">=1.0.1"
samtools = ">=1.24"
ucsc-bedclip = ">=482"
ucsc-bedgraphtobigwig = ">=482"
matplotlib = ">=3.11"
numpy = ">=2.5"
polars = ">=2.0"
pysam = ">=0.24.1"
python-zlib-ng = ">=1.0"
scipy = ">=1.18"

[pypi-dependencies]
poikilos = { git = "https://github.com/ramirc0/poikilos" }

[activation.env]
# Rule jobs only save figures. Without this, a job that inherits DISPLAY picks a GUI backend.
MPLBACKEND = "Agg"
# The image fixed its locale. Pinning one keeps sort order independent of the host.
LC_ALL = "C"

# idr 2.0.4.2, the last release, needs python <3.10, numpy <1.20 and scipy <1.10.
[feature.idr.dependencies]
python = "3.9.*"
idr = ">=2.0.4.2"
python-zlib-ng = "*"
ucsc-bedclip = ">=482"

[feature.idr.activation.env]
# The idr rule sorts its peaks; the order must not depend on the host locale.
LC_ALL = "C"

[feature.test.dependencies]
pytest = "*"
seqkit = "*"

[environments]
idr = { features = ["idr"], no-default-feature = true }
test = { features = ["test"] }
