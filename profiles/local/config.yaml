# Local execution.
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

cores: 22
printshellcmds: true
rerun-incomplete: true
keep-going: true
show-failed-logs: true
retries: 1
benchmark-extended: true

default-resources:
  mem_mb: 64000
  runtime: 240

set-threads:
  fastp_qc: 8
  trim: 8
  bowtie2_build: 22
  bowtie2_align: 22
  pbc_qc: 16
  filter: 22
  tagalign: 22
  macs3_signal: 22
  bedgraphtobigwig: 4
  macs3_fold_change_signal: 4
  macs3_pvalue_signal: 4
  macs3_callpeak: 22
  frag_len: 22
  tss_enrichment: 4
  frip_all: 22
  pseudoreps: 4
  macs3_pseudoreps: 4
  idr: 4
  overlap_peaks: 4
  overlap_peaks_abc: 4

set-resources:              # tune from benchmarks/ TSVs after a real run
  fastp_qc: {mem_mb: 32000}
  pbc_qc: {mem_mb: 96000}
  filter: {mem_mb: 128000}
  bedgraphtobigwig: {mem_mb: 128000}
