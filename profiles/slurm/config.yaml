executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: unlimited
max-jobs-per-timespan: 5/1s
# ILP re-solves a model per batch of finished jobs. With unlimited jobs, it only
# orders the 5/1s queue, so it frees temp() files only seconds sooner. Greedy
# starts big-input jobs first, so give a small blocking rule `priority:`.
scheduler: greedy

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8

default-resources:
  slurm_partition: 4hours
  runtime: 240m
  mem_mb: 8000 * attempt
  constraint: cascadelake
  slurm_extra: "--exclude=z1024 --cpu-freq=High-High:Performance"

set-threads:              # single-threaded rules get the default, 1
  fastp_qc: 8
  trim: 8
  bowtie2_build: 22
  bowtie2_build_mito: 4
  bowtie2_align: 22
  filter: 22
  tagalign: 8
  frac_mito: 22
  jsd: 2
  zscore: 2

set-resources:              # from peak RSS of the ENCODE validation run
  bowtie2_build:
    mem_mb: 16000 * attempt
  bowtie2_align:
    mem_mb: 64000 * attempt
    slurm_partition: 12hours
    runtime: 720m
  filter:
    mem_mb: 64000 * attempt
  tagalign:
    mem_mb: 32000 * attempt
  pbc_qc:
    mem_mb: 24000 * attempt

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
