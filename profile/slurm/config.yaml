use-apptainer: True
use-conda: True
apptainer-prefix: workflow/rules/envs
conda-prefix: workflow/rules/envs
apptainer-args: -B /zata,/data --nv

# max-jobs-per-timespan: 2/1s
retries: 3
rerun-incomplete: True
printshellcmds: True
