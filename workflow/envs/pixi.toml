[workspace]
name = "atac-smk-envs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

# Versions match the tools in clarity001/atac-smk:latest, the image the rules ran in before pixi.
[dependencies]
python = "3.12.*"
bc = "==1.07.1"
bedtools = "==2.31.1"
bowtie2 = "==2.5.4"
fastp = "==1.1.0"
htslib = "==1.23"
macs3 = "==3.0.4"
mbuffer = "*"
sambamba = "==1.0.1"
samtools = "==1.23"
ucsc-bedclip = "==482"
ucsc-bedgraphtobigwig = "==482"
bioframe = "==0.8.0"
matplotlib = ">=3.11"
numpy = "==2.2.6"
pandas = "==2.3.3"
polars = "==1.38.1"
pysam = "==0.23.3"
tqdm = "==4.67.3"

# The conda oxbow pulls a pyarrow that needs a newer lz4-c than sambamba allows.
[pypi-dependencies]
arro3-core = "==0.8.0"
oxbow = "==0.5.1"
poikilos = { git = "https://github.com/ramirc0/poikilos" }
pyarrow = "==23.0.1"

[activation.env]
# Rule jobs only save figures. Without this, a job that inherits DISPLAY picks a GUI backend.
MPLBACKEND = "Agg"
# The image had no locales, so sort collated in C order. Keep that order on every host.
LC_ALL = "C"

# IDR needs the Python 3.9 / NumPy 1.19 stack of the conda env it ran in before pixi.
[feature.idr.dependencies]
python = "3.9.*"
idr = "==2.0.4.2"
libopenblas = "==0.3.25"
matplotlib-base = "==3.5.3"
numpy = "==1.19.5"
scipy = "==1.9.1"

[environments]
idr = { features = ["idr"], no-default-feature = true }
