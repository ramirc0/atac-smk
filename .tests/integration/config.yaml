samples: .tests/integration/samples.tsv
outdir: results-fixture  # own refs/, so the chr21 index never replaces the GRCh38 one
pixi_env: default
run_id: fixture
mito_chr_name: chrM
tmp_dir: .tmp

references:
  fasta: resources/fixture/genome.fa
  tss: resources/fixture/ENCFF493CCB.bed.gz
  blacklist: resources/fixture/ENCFF356LFX.bed.gz
  dhs: resources/fixture/ENCFF304XEX.bed.gz
  promoters: resources/fixture/ENCFF140XLU.bed.gz
  enhancers: resources/fixture/ENCFF212UAV.bed.gz

params:
  multimapping: 4         # alignments a read may have; bowtie2 runs with -k multimapping+1
  pval_thresh: 0.01       # MACS3 p-value cutoff
  cap_num_peak: 300000    # peaks kept per call, by p-value
  smooth_win: 150         # MACS3 --extsize; --shift is minus half
  idr_thresh: 0.05
