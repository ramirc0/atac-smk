executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: unlimited
# Job selection reruns once per timespan and stats every ready job's input on
# NFS. At 1s, a driver with more ready jobs than slots pins a login-node core.
max-jobs-per-timespan: 50/10s
# ILP re-solves a model per batch of finished jobs. It only pays off with temp()
# outputs. Greedy starts big-input jobs first, so give a small blocking rule `priority:`.
scheduler: greedy

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8
slurm-init-seconds-before-status-checks: 10
# NODE_FAIL nodes join this list. An --exclude in slurm_extra would override it.
# z1076 cannot read /data. z1056 and z1081 lost their /data mount on 2026-11-05.
# z1072 could not see the MOHD FASTQs on 2026-11-13. z1018 stopped responding on
# 2026-11-14. Jobs on z1027 and z1028 ran 5-10x slower that day, starved for I/O.
slurm-exclude-failed-nodes: z1018,z1024,z1027,z1028,z1056,z1072,z1076,z1081

default-resources:
  slurm_partition: 4hours,12hours   # z1022-1029 are only in 12hours
  runtime: 240m
  mem_mb: 8000 * attempt
  slurm_extra: "--cpu-freq=High-High:Performance"

set-threads:              # single-threaded rules get the default, 1
  fastp_qc: 8
  trim: 8
  bowtie2_build: 22
  bowtie2_build_mito: 4
  bowtie2_align: 22
  filter: 22
  tagalign: 8
  frac_mito: 22
  jsd: 2
  zscore: 2
  gather_qc: 8
  qc_figures: 8

set-resources:              # from peak RSS of the ENCODE validation run
  bowtie2_build:
    mem_mb: 16000 * attempt
  bowtie2_align:
    mem_mb: 64000 * attempt
    slurm_partition: 12hours
    runtime: 720m
  filter:
    mem_mb: 96000 * attempt   # MOHD libraries peaked at 64.5 GB
  tagalign:
    mem_mb: 32000 * attempt
  pbc_qc:
    mem_mb: 64000 * attempt   # MOHD libraries peaked at 45.4 GB
  signal:
    mem_mb: 16000 * attempt   # macs3 bdgcmp passed 8 GB on a MOHD library
  pseudoreps:
    mem_mb: 16000 * attempt   # shuf holds the whole tagAlign; passed 8 GB on a MOHD library

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
# The cluster requeues NODE_FAIL jobs (JobRequeue=1). With false, Snakemake also
# retries them, and two copies write the same outputs.
slurm-requeue: true
printshellcmds: true
latency-wait: 60
