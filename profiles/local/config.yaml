# Local execution.
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

cores: 22
printshellcmds: true
rerun-incomplete: true
keep-going: true
show-failed-logs: true
retries: 1
benchmark-extended: true

default-resources:
  mem_mb: 8000
  runtime: 240

set-threads:              # single-threaded rules get the default, 1
  fastp_qc: 8
  trim: 8
  bowtie2_build: 22
  bowtie2_build_mito: 4
  bowtie2_align: 22
  filter: 22
  tagalign: 8
  frac_mito: 22
  jsd: 2
  zscore: 2

set-resources:              # from peak RSS of the ENCODE validation run
  bowtie2_build: {mem_mb: 16000}
  bowtie2_align: {mem_mb: 64000}
  filter: {mem_mb: 64000}
  tagalign: {mem_mb: 32000}
  pbc_qc: {mem_mb: 24000}

