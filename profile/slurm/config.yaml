executor: slurm
jobs: unlimited

set-resources:
  fastp:
    runtime: 240m
    constraint: cascadelake
    slurm_extra: "--exclude=z[1071,1024] --cpu-freq=High-High:Performance"
    slurm_partition: 4hours
    threads: 8
    cpus_per_task: 8
    mem: 32000MB
  bowtie2_build:
    runtime: 240m
    constraint: cascadelake
    slurm_extra: "--exclude=z[1071,1024] --cpu-freq=High-High:Performance"
