# Local execution.
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

cores: 22
printshellcmds: true
rerun-incomplete: true
keep-going: true
show-failed-logs: true
retries: 1
benchmark-extended: true

default-resources:
  mem_mb: 64000
  runtime: 240

set-threads:
  fastp_qc: 8
  trim: 8
  bowtie2_build: 22
  bowtie2_align: 22
  pbc_qc: 16
  filter: 22
  tagalign: 22
  frag_len: 1
  tss_enrichment: 1
  pseudoreps: 1
  macs3: 1
  macs3_pseudorep: 1
  blacklist_filter: 1
  signal: 1
  idr: 1
  plot_idr: 1
  overlap: 1
  frip: 1

set-resources:              # tune from benchmarks/ TSVs after a real run
  fastp_qc: {mem_mb: 32000}
  pbc_qc: {mem_mb: 96000}
  filter: {mem_mb: 128000}
