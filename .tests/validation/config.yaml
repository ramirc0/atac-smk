samples: .tests/validation/samples.tsv
outdir: results
pixi_env: default
run_id: encode-validation
mito_chr_name: chrM
tmp_dir: .tmp

references:
  fasta: /data/zusers/ramirezc/atac-smk/resources/GRCh38_no_alt_analysis_set_GCA_000001405.15.fasta
  tss: /data/zusers/ramirezc/atac-smk-refs/GRCh38/ENCFF493CCB.bed.gz
  blacklist: /data/zusers/ramirezc/atac-smk-refs/GRCh38/ENCFF356LFX.bed.gz
  dhs: /data/zusers/ramirezc/atac-smk-refs/GRCh38/ENCFF304XEX.bed.gz
  promoters: /data/zusers/ramirezc/atac-smk-refs/GRCh38/ENCFF140XLU.bed.gz
  enhancers: /data/zusers/ramirezc/atac-smk-refs/GRCh38/ENCFF212UAV.bed.gz

params:
  multimapping: 4         # alignments a read may have; bowtie2 runs with -k multimapping+1
  pval_thresh: 0.01       # MACS3 p-value cutoff
  cap_num_peak: 300000    # peaks kept per call, by p-value
  smooth_win: 150         # MACS3 --extsize; --shift is minus half
  idr_thresh: 0.05
